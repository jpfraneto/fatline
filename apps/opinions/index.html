<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f0d24" />
    <title>Fatline</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <a href="#/" class="name"><span class="planet" id="planet" aria-hidden="true"></span>Fatline</a>
        <span class="tagline" data-t="tagline"></span>
      </div>
      <!-- Which copy of Farcaster this reads: always in sight, one tap to switch. -->
      <div class="netswitch" id="netswitch" role="radiogroup" aria-label="Network"></div>
      <a href="#/settings" id="settings-link" class="gear" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7zm7.43-2.53c.04-.32.07-.64.07-.97s-.03-.66-.07-1l2.11-1.63a.5.5 0 0 0 .12-.64l-2-3.46a.5.5 0 0 0-.61-.22l-2.49 1a7.3 7.3 0 0 0-1.69-.98l-.38-2.65A.49.49 0 0 0 14 2h-4a.49.49 0 0 0-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1a.5.5 0 0 0-.61.22l-2 3.46a.49.49 0 0 0 .12.64L4.57 11c-.04.34-.07.67-.07 1s.03.65.07.97l-2.11 1.66a.49.49 0 0 0-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1.01c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65a7.3 7.3 0 0 0 1.69-.98l2.49 1.01c.22.08.49 0 .61-.22l2-3.46a.5.5 0 0 0-.12-.64l-2.11-1.66z"/></svg>
      </a>
    </header>
    <p class="source" id="source" hidden></p>

    <!-- The bar, as in the iOS app: Today, Fatline, you (your face, or the Farcaster arch to sign in), and the pen. -->
    <nav class="tabs" id="tabs">
      <a href="#/" data-tab="home"><span class="glyph" data-glyph="stream"></span><span class="tab-name" data-t="tabHome"></span></a>
      <a href="#/fatline" data-tab="fatline"><span class="glyph" data-glyph="star"></span><span class="tab-name" data-t="tabFatline"></span></a>
      <a href="#/voices" data-tab="voices"><span class="glyph" data-glyph="voice"></span><span class="tab-name" data-t="tabVoices"></span></a>
      <a href="#/people" data-tab="me" id="me-tab" class="tab-me"><span class="me-face" id="me-face"></span></a>
    </nav>

    <main id="main"></main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
