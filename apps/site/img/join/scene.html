<!doctype html>
<!-- Source of join.gif / join.mp4 (10 s). Each frame is this page at ?t=<seconds>: screenshot 150 frames at 15 fps with headless Chrome (960x540), then ffmpeg to mp4 and gif. -->
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,300..900,0..100,0..1&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 960px; height: 540px; overflow: hidden; }
  body { background: radial-gradient(800px 500px at 50% -10%, rgba(61,139,255,.25), transparent 60%), #0f1420; color: #f3eadb; font-family: Inter, sans-serif; position: relative; }
  .title { position: absolute; left: 0; right: 0; text-align: center; font: 800 54px/1.05 Fraunces, serif; font-variation-settings: 'SOFT' 100, 'WONK' 1; }
  .sub { position: absolute; left: 0; right: 0; text-align: center; font: 500 16px 'JetBrains Mono', monospace; letter-spacing: .18em; text-transform: uppercase; color: #a9a08f; }
  .sub b { color: #7aa8ff; font-weight: 500; } .sub i { color: #ff8cc0; font-style: normal; }
  .term { position: absolute; left: 80px; right: 80px; top: 150px; height: 300px; background: #0a0d14; border: 1px solid rgba(243,234,219,.16); border-radius: 14px; box-shadow: 0 30px 80px rgba(0,0,0,.5); font: 17px/1.75 'JetBrains Mono', monospace; padding: 44px 26px 20px; box-sizing: border-box; }
  .term .bar { position: absolute; top: 14px; left: 18px; display: flex; gap: 8px; } .term .bar i { width: 11px; height: 11px; border-radius: 50%; background: #2a3140; display: block; }
  .term .bar span { position: absolute; left: 70px; top: -3px; font-size: 12px; color: #6b7280; white-space: nowrap; }
  .p { color: #7aa8ff; } .ok { color: #8fe3a2; } .dim { color: #a9a08f; } .ask { color: #ffc65c; }
  .cursor { display: inline-block; width: 9px; height: 19px; background: #f3eadb; vertical-align: -3px; }
  .line { white-space: pre; }
  .end { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 42px; }
  .egg { width: 250px; height: 250px; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 3px rgba(255,198,92,.35), 0 0 60px rgba(255,170,80,.35); }
  .egg img { width: 100%; height: 100%; object-fit: cover; }
  .steps { font: 700 34px/1.25 Fraunces, serif; font-variation-settings: 'SOFT' 100; }
  .steps > div { opacity: 0; } .steps small { display: block; font: 500 15px 'JetBrains Mono', monospace; color: #a9a08f; letter-spacing: .12em; text-transform: uppercase; margin-top: 18px; }
  .days { display: flex; gap: 8px; margin-top: 14px; } .days i { width: 70px; height: 7px; border-radius: 6px; background: #262c3a; overflow: hidden; display: block; } .days b { display: block; height: 100%; background: linear-gradient(90deg,#3d8bff,#fff,#ff5fa8); }
</style>
<div id="intro"><div class="title" style="top:150px">Bring your own node.</div><div class="sub" style="top:230px"><b>Snapchain</b> or <i>Hypersnap</i> → Fatline</div></div>
<div id="t1" class="title" style="top:40px;font-size:38px">Bring your own node.</div>
<div id="t2" class="sub" style="top:96px;font-size:13px">one line, on the server where your node runs</div>
<div class="term" id="term"><div class="bar"><i></i><i></i><i></i><span>root@your-node</span></div><div id="out"></div></div>
<div class="end" id="end">
  <div class="egg"><img id="eggimg" src="../eggs/gold.jpg"></div>
  <div class="steps"><div id="s1">Your node keeps an egg warm.</div><div id="s2">3 warm days.</div><div id="s3">It hatches.</div>
    <div id="s4"><div class="days"><i><b id="d1"></b></i><i><b id="d2"></b></i><i><b id="d3"></b></i></div><small>fatline.ink/join.sh</small></div></div>
</div>
<script>
const CMD = 'curl -fsSL https://fatline.ink/join.sh | sudo bash';
const clamp = (x) => Math.max(0, Math.min(1, x));
const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
const show = (el, a) => { el.style.opacity = a; };
function render(t) {
  const intro = document.getElementById('intro'), term = document.getElementById('term'), end = document.getElementById('end');
  // 0–1.4 s: the title alone, then it moves up
  show(intro, t < 1.2 ? ease(t / 0.4) : 1 - ease((t - 1.2) / 0.3));
  const inTerm = t >= 1.3 && t < 7.4;
  show(document.getElementById('t1'), t < 1.3 ? 0 : t < 7.4 ? ease((t - 1.3) / 0.3) : 1 - ease((t - 7.4) / 0.3));
  show(document.getElementById('t2'), document.getElementById('t1').style.opacity);
  show(term, t < 1.3 ? 0 : t < 7.4 ? ease((t - 1.3) / 0.3) : 1 - ease((t - 7.4) / 0.3));
  term.style.transform = `translateY(${(1 - ease((t - 1.3) / 0.4)) * 20}px)`;
  // typing 1.6–3.2 s
  const n = Math.round(CMD.length * clamp((t - 1.6) / 1.5));
  const lines = [`<span class="p">$</span> ${CMD.slice(0, n)}${t < 3.3 && Math.floor(t * 3) % 2 === 0 ? '<span class="cursor"></span>' : ''}`];
  // Either network: the name flips Snapchain ↔ Hypersnap while the line is on screen.
  const hyper = Math.floor(Math.max(0, t - 3.5) / 0.55) % 2 === 1;
  if (t >= 3.5) lines.push(`<span class="ok">✓</span> found your node: <span style="color:${hyper ? '#ff8cc0' : '#7aa8ff'}">${hyper ? 'Hypersnap' : 'Snapchain'}</span> <span class="dim">· in sync · left untouched</span>`);
  if (t >= 4.9) lines.push(`<span class="ask">?</span> install the hatchery next to it (port 8791)? <span class="ok">y</span>`);
  if (t >= 5.6) lines.push(`<span class="ok">✓</span> hatchery running <span class="dim">· servers check each other every hour</span>`);
  if (t >= 6.2) lines.push(`<span class="ok">✓</span> auto-upgrade on <span class="dim">· a new Snapchain, every day</span>`);
  if (t >= 6.7) lines.push(`<span class="p">→</span> lay your egg: <span class="ask">fatline egg</span>`);
  document.getElementById('out').innerHTML = lines.map((l) => `<div class="line">${l}</div>`).join('');
  // 7.6–10 s: the egg
  show(end, t < 7.6 ? 0 : ease((t - 7.6) / 0.4));
  document.querySelector('.egg').style.transform = `scale(${0.9 + 0.1 * ease((t - 7.6) / 0.6)})`;
  ['s1', 's2', 's3', 's4'].forEach((id, i) => show(document.getElementById(id), ease((t - (7.8 + i * 0.3)) / 0.3)));
  [1, 2, 3].forEach((d) => (document.getElementById('d' + d).style.width = `${100 * clamp((t - (8.8 + (d - 1) * 0.25)) / 0.25)}%`));
}
const t = Number(new URLSearchParams(location.search).get('t') ?? 0);
document.fonts.ready.then(() => { render(t); document.title = 'ready'; });
render(t);
</script>
