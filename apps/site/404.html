<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fatline</title>
<meta name="description" content="A Fatline coin on Base and the nodes it keeps alive.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0a1f'/%3E%3Ccircle cx='32' cy='32' r='20' fill='none' stroke='%23a46bff' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='13' fill='none' stroke='%2341e2e8' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { --bg: #07061a; --panel: rgba(28, 20, 66, .55); --line: rgba(164, 107, 255, .28); --text: #f1eeff; --muted: #a49fc4;
    --violet: #a46bff; --cyan: #41e2e8; --amber: #ffb547; }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { margin: 0; color: var(--text); font: 16px/1.5 Inter, system-ui, sans-serif; min-height: 100vh;
    background: radial-gradient(1000px 500px at 70% -10%, rgba(123, 61, 255, .22), transparent 60%), var(--bg); }
  a { color: inherit; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 0 16px; }
  header { display: flex; align-items: center; gap: 28px; padding: 18px 0; }
  .brand { font: 700 26px/1 Cinzel, serif; letter-spacing: .14em; text-decoration: none; }
  nav { display: flex; gap: 22px; font-size: 15px; color: var(--muted); }
  nav a { text-decoration: none; }
  .panel { margin: 28px 0; padding: 24px; border: 1px solid rgba(164, 107, 255, .5); border-radius: 22px;
    background: linear-gradient(120deg, rgba(60, 30, 140, .45), rgba(20, 14, 52, .6)); }
  .kicker { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  h1 { font-size: clamp(28px, 6vw, 44px); margin: 4px 0 8px; font-weight: 800; }
  code { font: 14px ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; color: #e7e1ff; }
  .muted { color: var(--muted); }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 6px 0; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot.snapchain { background: var(--violet); box-shadow: 0 0 8px var(--violet); }
  .dot.hypersnap { background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
  .dot.off { background: #666; }
  .who img { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; }
  .btn { display: inline-flex; padding: 11px 18px; border-radius: 12px; font-weight: 600; text-decoration: none;
    border: 1px solid rgba(255, 255, 255, .28); margin: 14px 10px 0 0; }
  .btn.primary { background: linear-gradient(180deg, #8c4dff, #6a2cf0); border-color: #b28aff; }
  h2 { font-size: 20px; margin: 30px 0 4px; }
  .total { font-size: 15px; color: #d8d3f2; margin: 0 0 14px; }
  .total b { font-size: 22px; color: var(--text); }
  .servers { display: grid; grid-template-columns: minmax(0, 560px); gap: 16px; }
  .server { padding: 18px; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); min-width: 0; }
  .server h3 { margin: 0; font-size: 17px; display: flex; gap: 8px; align-items: center; }
  .server .spec { font-size: 13.5px; color: var(--muted); margin: 4px 0 12px; }
  .meter { margin: 10px 0; font-size: 13.5px; }
  .meter .lbl { display: flex; justify-content: space-between; gap: 8px; }
  .meter .lbl span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
  .bar { height: 8px; border-radius: 99px; background: rgba(255, 255, 255, .08); overflow: hidden; margin-top: 4px; }
  .bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--violet), var(--cyan)); }
  .bar i.hot { background: var(--amber); }
  .bar i.red { background: #ff5d6c; }
  table.cost { width: 100%; border-collapse: collapse; font-size: 13.5px; margin-top: 12px; font-variant-numeric: tabular-nums; }
  table.cost td { padding: 4px 0; border-top: 1px solid rgba(164, 107, 255, .14); }
  table.cost td:last-child { text-align: right; }
  table.cost tr.sum td { font-weight: 700; color: var(--text); }
  .note { font-size: 13px; color: var(--muted); margin-top: 12px; }
  .warnline { color: var(--amber); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" href="/">FATLINE</a>
    <nav><a href="/">Explore</a><a href="/#about">About</a><a href="/docs/">Docs</a></nav>
  </header>
  <main id="main"><p class="muted">Loading…</p></main>
</div>
<script>
// GitHub Pages serves this page for every path it has no file for. /f/<TICKER> is a Fatline's page,
// /base/0x<address> is its coin's page (the same page, once the coin exists); anything else is "not found".
const NAME = { snapchain: 'Snapchain', hypersnap: 'Hypersnap' };
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const main = document.getElementById('main');
const m = location.pathname.match(/^\/base\/(0x[0-9a-fA-F]{40})\/?$/);
const t = location.pathname.match(/^\/f\/([A-Za-z0-9]{1,12})\/?$/);
const usd = (x) => `$${Number(x).toFixed(2)}`;
const gb = (mb) => `${Math.round(mb / 1024)} GB`;

function meter(label, pct, detail) {
  const p = Math.max(0, Math.min(100, pct));
  return `<div class="meter"><div class="lbl"><span>${label}</span><span>${detail}</span></div>
    <div class="bar"><i class="${p >= 92 ? 'red' : p >= 80 ? 'hot' : ''}" style="width:${p.toFixed(1)}%"></i></div></div>`;
}
function uptime(sec) { const d = Math.floor(sec / 86400), h = Math.floor(sec / 3600) % 24; return d ? `${d} d ${h} h` : `${h} h`; }

// What keeps this Fatline alive: its server, how full it is, and what it costs.
function body(f) {
  const s = f.server;
  if (!s) return '';
  const l = s.live, c = s.cost;
  const meters = l ? [
    meter('CPU', l.cpuBusyPct, `${l.cpuBusyPct.toFixed(0)}% busy · load ${l.load?.[1]?.toFixed(1)} on ${l.cores} cores`),
    meter('Memory', 100 * l.memUsedMb / l.memTotalMb, `${(l.memUsedMb / 1024).toFixed(1)} of ${(l.memTotalMb / 1024).toFixed(1)} GB`),
    ...l.disks.map((d) => meter(esc(d.label), 100 * d.usedMb / (d.usedMb + d.freeMb), `${gb(d.usedMb)} used · ${gb(d.freeMb)} free`)),
  ].join('') + `<div class="note">Server up ${uptime(l.uptimeSec)} · ${(l.nodes ?? []).map((n) => `${esc(n.container.split('-')[0])} ${esc(n.state)}`).join(' · ')} · measured ${since(l.at)} ago</div>`
    : '<p class="note warnline">Live numbers unavailable at the last check.</p>';
  const low = l?.disks.some((d) => d.freeMb < 25 * 1024) ? '<p class="note warnline">A disk is nearly full (under 25 GB free). The disk watch grows it or alerts the owner.</p>' : '';
  return `<h2>Its body</h2>
    <p class="total">Keeping it alive costs <b>${usd(c.monthUsd)}</b> a month, about ${usd(c.dayUsd)} a day.</p>
    <div class="servers"><div class="server">
      <h3>${f.nodes.map((n) => `<span class="dot ${n.state === 'offline' ? 'off' : n.network}"></span>`).join('')} One server, ${f.nodes.length} networks</h3>
      <div class="spec">${esc(s.provider)} ${esc(s.type)} · ${esc(s.location)}<br>${esc(s.cpu)} · ${s.ramGb} GB RAM</div>
      ${meters}${low}
      <table class="cost">
        <tr><td>Server (${esc(s.type)})</td><td>${usd(c.server)}/mo</td></tr>
        ${c.volumes.map((v) => `<tr><td>${esc(v.label)}, ${v.gb} GB</td><td>${usd(v.monthUsd)}/mo</td></tr>`).join('')}
        <tr><td>IPv4 address</td><td>${usd(c.ipv4)}/mo</td></tr>
        <tr class="sum"><td>Total</td><td>${usd(c.monthUsd)}/mo · ${usd(c.dayUsd)}/day</td></tr>
      </table></div></div>
    <p class="note">${s.note ? esc(s.note) + ' ' : ''}Prices from Hetzner's API (${esc(c.pricesAsOf)}, USD with VAT); Hetzner bills by the hour, capped at the monthly price.
      Live numbers come from the server every 5 minutes; this page is refreshed every 15.${f.notice ? '<br>' + esc(f.notice) : ''}</p>`;
}

function nodeRows(f) {
  return f.nodes.map((n) => `<div class="row"><span class="dot ${n.state === 'offline' ? 'off' : n.network}"></span><b>${NAME[n.network]}</b>
      <span class="muted">${n.state === 'alive' ? `alive · running ${since(n.since)}` : n.state === 'catching-up' ? `catching up · ${Number(n.blocksBehind).toLocaleString('en')} blocks behind` : 'offline at the last check'} · ${esc(n.label)}</span></div>`).join('');
}
function owner(f) {
  const o = f.owner ?? {};
  return `<div class="row who">${o.pfp ? `<img src="${esc(o.pfp)}" alt="" referrerpolicy="no-referrer">` : ''}<span>@${esc(o.username)} · FID ${esc(o.fid)}</span></div>`;
}

function since(iso) {
  const ms = Date.now() - Date.parse(iso), h = Math.floor(ms / 3600e3);
  return h >= 24 ? `${Math.floor(h / 24)} d ${h % 24} h` : h >= 1 ? `${h} h` : `${Math.max(1, Math.round(ms / 60e3))} min`;
}

if (t) {
  fetch('/status.json', { cache: 'no-store' }).then((r) => r.ok ? r.json() : null).catch(() => null).then((s) => {
    const f = (s?.fatlines ?? []).find((x) => x.ticker.toLowerCase() === t[1].toLowerCase());
    if (!f) {
      document.title = 'Not found · Fatline';
      main.innerHTML = `<div class="panel"><div class="kicker">Fatline</div><h1>No $${esc(t[1].toUpperCase())} here</h1>
        <p class="muted">${s ? 'No Fatline on this board has that name.' : 'The status of the board could not be loaded right now.'}</p><a class="btn primary" href="/">Back to the board</a></div>`;
      return;
    }
    document.title = `$${f.ticker} · Fatline`;
    const coin = f.coin?.address
      ? `<p>Coin on Base: <a href="/base/${esc(f.coin.address)}"><code>${esc(f.coin.address)}</code></a></p>`
      : '<p class="muted">Coin not launched yet. Its page will be /base/&lt;its address&gt;.</p>';
    main.innerHTML = `<div class="panel"><div class="kicker">Fatline</div><h1>$${esc(f.ticker)}</h1>${owner(f)}${coin}
      <h2>Its nodes</h2>${nodeRows(f)}${body(f)}
      <a class="btn" href="/docs/">Run your own ↗</a><a class="btn primary" href="/">Back to the board</a></div>`;
  });
} else if (!m) {
  document.title = 'Not found · Fatline';
  main.innerHTML = `<div class="panel"><div class="kicker">404</div><h1>Nothing here</h1>
    <p class="muted">No page at <code>${esc(location.pathname)}</code>. A coin's page is <code>/base/0x…</code>, its contract address on Base.</p>
    <a class="btn primary" href="/">Back to the board</a></div>`;
} else {
  const address = m[1];
  fetch('/status.json', { cache: 'no-store' }).then((r) => r.ok ? r.json() : null).catch(() => null).then((s) => {
    const f = (s?.fatlines ?? []).find((x) => x.coin?.address?.toLowerCase() === address.toLowerCase());
    const scan = `https://basescan.org/token/${address}`;
    if (!f) {
      document.title = `${address.slice(0, 10)}… · Fatline`;
      main.innerHTML = `<div class="panel"><div class="kicker">Base · coin</div><h1>Not a known Fatline</h1>
        <p><code>${esc(address)}</code></p>
        <p class="muted">No Fatline on this board has this address. It may be any other token on Base, or a Fatline that isn't listed yet.</p>
        <a class="btn" href="${scan}">See it on Basescan ↗</a><a class="btn primary" href="/">Back to the board</a></div>`;
      return;
    }
    document.title = `$${f.ticker} · Fatline`;
    main.innerHTML = `<div class="panel"><div class="kicker">Base · Fatline coin</div><h1>$${esc(f.ticker)}</h1>
      <p><code>${esc(address)}</code></p>${owner(f)}
      <h2>Nodes it keeps alive</h2>${nodeRows(f)}${body(f)}
      <a class="btn" href="${scan}">Basescan ↗</a><a class="btn primary" href="/">Back to the board</a></div>`;
  });
}
</script>
</body>
</html>
