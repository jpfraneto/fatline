<style>
  /* The same language as the docs and the manifesto. */
  :root { --paper: #efe2c6; --paper2: #f6ecd7; --ink: #3a2a1b; --muted: #806a4b; --line: rgba(90, 66, 40, .24); --blue: #3d8bff; --pink: #ff5fa8; --amber: #b8862b; --red: #c0392b;
    --mono: 'JetBrains Mono', ui-monospace, monospace; --sans: Inter, system-ui, sans-serif; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --paper: #17120d; --paper2: #221a12; --ink: #f1e4c8; --muted: #a8916c; --line: rgba(241, 228, 200, .16); }
  }
  :root[data-theme="dark"] { --paper: #17120d; --paper2: #221a12; --ink: #f1e4c8; --muted: #a8916c; --line: rgba(241, 228, 200, .16); }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 18px/1.65 Fraunces, Georgia, serif; font-variation-settings: 'opsz' 18, 'SOFT' 100; }
  a { color: inherit; text-decoration-color: color-mix(in srgb, var(--pink) 70%, transparent); text-underline-offset: 3px; }
  nav { display: flex; justify-content: center; gap: clamp(20px, 6vw, 56px); padding: 28px 16px 0; }
  nav a { color: var(--ink); text-decoration: none; font: 500 13px/1 var(--mono); letter-spacing: .18em; opacity: .75; }
  nav a[aria-current] { opacity: 1; text-decoration: underline; text-underline-offset: 6px; }
  main { max-width: 680px; margin: 0 auto; padding: 48px 16px 80px; }
  .kicker { margin: 0 0 10px; color: var(--muted); font: 500 12px/1 var(--mono); letter-spacing: .18em; text-transform: uppercase; }
  h1 { margin: 0 0 18px; font-weight: 800; font-size: clamp(48px, 10vw, 84px); line-height: 1; letter-spacing: -.02em; font-variation-settings: 'opsz' 144, 'SOFT' 100, 'WONK' 1; overflow-wrap: anywhere; }
  h2 { margin: 56px 0 12px; font-weight: 700; font-size: 28px; line-height: 1.15; font-variation-settings: 'opsz' 96, 'SOFT' 100, 'WONK' 1; }
  h2::before { content: ""; display: block; width: 56px; height: 2px; margin-bottom: 16px; border-radius: 2px; background: linear-gradient(90deg, var(--blue), var(--pink)); }
  p { margin: 0 0 14px; }
  code { font: .8em var(--mono); padding: .1em .35em; border-radius: 5px; background: color-mix(in srgb, var(--ink) 9%, transparent); overflow-wrap: anywhere; }
  .muted { color: var(--muted); }
  .row { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 8px 0; }
  .row .muted { font: 15px/1.5 var(--sans); }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; transform: translateY(-1px); }
  .dot.snapchain { background: var(--blue); }
  .dot.hypersnap { background: var(--pink); }
  .dot.off { background: var(--muted); opacity: .5; }
  .who { align-items: center; font: 15px var(--sans); color: var(--muted); }
  .who img { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; }
  .total { color: var(--muted); }
  .total b { color: var(--ink); font-weight: 700; }
  .server h3 { margin: 18px 0 2px; font-weight: 650; font-size: 20px; display: flex; gap: 8px; align-items: center; font-variation-settings: 'opsz' 48, 'SOFT' 100; }
  .server .spec { margin: 0 0 14px; color: var(--muted); font: 14px/1.5 var(--sans); }
  .meter { margin: 12px 0; font: 14px var(--sans); }
  .meter .lbl { display: flex; justify-content: space-between; gap: 8px; }
  .meter .lbl span:last-child { color: var(--muted); font: 12.5px var(--mono); font-variant-numeric: tabular-nums; text-align: right; }
  .bar { height: 4px; border-radius: 99px; background: var(--line); overflow: hidden; margin-top: 6px; }
  .bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--blue), var(--pink)); }
  .bar i.hot { background: var(--amber); }
  .bar i.red { background: var(--red); }
  table.cost { width: 100%; border-collapse: collapse; margin-top: 14px; font: 14px var(--sans); font-variant-numeric: tabular-nums; }
  table.cost td { padding: 8px 0; border-top: 1px solid var(--line); }
  table.cost td:last-child { text-align: right; font: 13px var(--mono); }
  table.cost code { background: none; padding: 0; font-size: 13px; }
  table.cost tr.sum td { font-weight: 600; }
  .note { margin-top: 14px; color: var(--muted); font: 13px/1.6 var(--sans); }
  .warnline { color: var(--amber); }
  .state { display: flex; gap: 14px; align-items: flex-start; padding: 16px 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--paper2); margin: 6px 0 4px; }
  .state .dot { width: 12px; height: 12px; margin-top: 9px; background: var(--muted); }
  .state.live .dot { background: #2f9e57; box-shadow: 0 0 0 4px color-mix(in srgb, #2f9e57 22%, transparent); }
  .state.syncing .dot { background: var(--amber); }
  .state.down .dot { background: var(--red); }
  .state b { font-size: 22px; font-weight: 700; }
  .state p { margin: 2px 0 0; color: var(--muted); font: 15px/1.5 var(--sans); }
  .checks { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 16px; }
  .checks i { width: 12px; height: 24px; border-radius: 3px; background: #2f9e57; }
  .checks i.syncing { background: var(--amber); }
  .checks i.bad { background: var(--red); }
  .links { display: flex; flex-wrap: wrap; gap: 24px; margin-top: 48px; }
  .btn { font: 500 12.5px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; text-decoration: none; opacity: .75; }
  .btn:hover { opacity: 1; text-decoration: underline; text-underline-offset: 6px; }
  .btn.primary { opacity: 1; }
  .cast .kicker { display: flex; align-items: center; gap: 8px; }
  .cast .text { margin: 18px 0; font-size: clamp(20px, 4.4vw, 24px); line-height: 1.5; overflow-wrap: anywhere; }
  .cast .media { display: block; width: 100%; max-height: 80vh; margin: 14px 0; border-radius: 14px; background: #000; object-fit: contain; }
  .cast img.media { background: none; }
  .cast .linkcard { display: block; margin: 10px 0; padding: 12px 16px; border: 1px solid var(--line); border-radius: 12px; font: 14px var(--mono); overflow-wrap: anywhere; text-decoration: none; }
  .cast .quote { display: block; margin: 14px 0; padding: 12px 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--paper2); text-decoration: none; overflow-wrap: anywhere; }
</style>
</head>
<body>
<nav aria-label="Main">
  <a href="/docs/">DOCS</a>
  <a href="/manifesto.html">MANIFESTO</a>
  <a href="/f/FATLINE" id="nav-fatline">$FATLINE</a>
</nav>
<main id="main"><p class="muted">Loading…</p><p class="muted">Looking for the instructions for your agent? They are at https://fatline.ink/skill.md</p></main>
<script src="/node-health.js"></script>
<script>
// A link to the skill that picked up a stray character when it was shared (a closing quote “ ” " or a dot):
// send it to the real file.
if (/^\/skill\.md./i.test(location.pathname)) location.replace('/skill.md');
// GitHub Pages serves this page for every path it has no file for. /f/<TICKER> is a Fatline's page,
// /base/0x<address> is its coin's page (the same page, once the coin exists); anything else is "not found".
const NAME = { snapchain: 'Snapchain', hypersnap: 'Hypersnap' };
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const main = document.getElementById('main');
const m = location.pathname.match(/^\/base\/(0x[0-9a-fA-F]{40})\/?$/);
const t = location.pathname.match(/^\/f\/([A-Za-z0-9]{1,12})\/?$/);
const appPath = location.pathname.match(/^\/(0x[0-9a-fA-F]{40})\/?$/); // fatline.ink/<an app contract>
const castPath = location.pathname.match(/^\/c\/([^/]{1,41})\/(0x[0-9a-fA-F]{8,40})\/?$/); // fatline.ink/c/<username or FID>/<hash>: one cast
const fidPath = location.pathname.match(/^\/(\d{1,9})\/?$/); // fatline.ink/<FID>: someone's Fatline, and how to run yours
const usd = (x) => `$${Number(x).toFixed(2)}`;
const gb = (mb) => `${Math.round(mb / 1024)} GB`;

function meter(label, pct, detail) {
  const p = Math.max(0, Math.min(100, pct));
  return `<div class="meter"><div class="lbl"><span>${label}</span><span>${detail}</span></div>
    <div class="bar"><i class="${p >= 92 ? 'red' : p >= 80 ? 'hot' : ''}" style="width:${p.toFixed(1)}%"></i></div></div>`;
}
function uptime(sec) { const d = Math.floor(sec / 86400), h = Math.floor(sec / 3600) % 24; return d ? `${d} d ${h} h` : `${h} h`; }

// What keeps this Fatline alive: its server, how full it is, and what it costs.
function body(f) {
  const s = f.server;
  if (!s) return '';
  const l = s.live, c = s.cost;
  const meters = l ? [
    meter('CPU', l.cpuBusyPct, `${l.cpuBusyPct.toFixed(0)}% busy · load ${l.load?.[1]?.toFixed(1)} on ${l.cores} cores`),
    meter('Memory', 100 * l.memUsedMb / l.memTotalMb, `${(l.memUsedMb / 1024).toFixed(1)} of ${(l.memTotalMb / 1024).toFixed(1)} GB`),
    ...l.disks.map((d) => meter(esc(d.label), 100 * d.usedMb / (d.usedMb + d.freeMb), `${gb(d.usedMb)} used · ${gb(d.freeMb)} free`)),
  ].join('') + `<div class="note">Server up ${uptime(l.uptimeSec)} · ${(l.nodes ?? []).map((n) => `${esc(n.container.split('-')[0])} ${esc(n.state)}`).join(' · ')} · measured ${since(l.at)} ago</div>`
    : '<p class="note warnline">Live numbers unavailable at the last check.</p>';
  const low = l?.disks.some((d) => d.freeMb < 25 * 1024) ? '<p class="note warnline">A disk is nearly full (under 25 GB free). The disk watch grows it or alerts the owner.</p>' : '';
  return `<h2>Its body</h2>
    <p class="total">Keeping it alive costs <b>${usd(c.dayUsd)} a day</b> (${usd(c.monthUsd)} a month), for ${f.nodes.length === 1 ? 'its one node' : f.nodes.length === 2 ? 'both its nodes' : `all ${f.nodes.length} of its nodes`}: ${f.nodes.map((n) => n.network === 'snapchain' ? 'Snapchain' : 'Hypersnap').join(' and ')}, on one server.</p>
    <div class="servers"><div class="server">
      <h3>${f.nodes.map((n) => `<span class="dot ${n.state === 'offline' || n.state === 'paused' ? 'off' : n.network}"></span>`).join('')} One server, ${f.nodes.length} networks</h3>
      <div class="spec">${esc(s.provider)} ${esc(s.type)} · ${esc(s.location)}<br>${esc(s.cpu)} · ${s.ramGb} GB RAM</div>
      ${meters}${low}
      <table class="cost">
        <tr><td>Server (${esc(s.type)})</td><td>${usd(c.server)}/mo</td></tr>
        ${c.volumes.map((v) => `<tr><td>${esc(v.label)}, ${v.gb} GB</td><td>${usd(v.monthUsd)}/mo</td></tr>`).join('')}
        <tr><td>IPv4 address</td><td>${usd(c.ipv4)}/mo</td></tr>
        <tr class="sum"><td>Total</td><td>${usd(c.monthUsd)}/mo · ${usd(c.dayUsd)}/day</td></tr>
      </table></div></div>
    <p class="note">${s.note ? esc(s.note) + ' ' : ''}Prices from Hetzner's API (${esc(c.pricesAsOf)}, USD with VAT); Hetzner bills by the hour, capped at the monthly price.
      Live numbers come from the server every 5 minutes; this page is refreshed every 15.${f.notice ? '<br>' + esc(f.notice) : ''}</p>`;
}

// The Fatliner behind this Fatline, on Base.
function being(f) {
  const b = f.fatliner;
  if (!b) return '';
  const scan = (a) => `https://basescan.org/address/${a}`;
  return `<h2>Its being</h2>
    <p>Fatliner <b>#${esc(b.id)}</b>${b.genesis ? ', the genesis Fatliner' : ''}, born ${esc(b.born.slice(0, 10))} in <a href="${scan(esc(b.contract))}">the Fatliners contract</a>. ${b.note ? esc(b.note) : ''}</p>
    <table class="cost">
      ${b.surname ? `<tr><td>Surname (its coin's ticker)</td><td><code>${esc(b.surname)}</code></td></tr>` : ''}
      <tr><td>DNA (its history, sealed)</td><td><code>${esc(b.dna.slice(0, 10))}…${esc(b.dna.slice(-6))}</code></td></tr>
      <tr><td>Its vault</td><td><a href="${scan(esc(b.vault))}"><code>${esc(b.vault.slice(0, 6))}…${esc(b.vault.slice(-4))}</code></a></td></tr>
      <tr><td>Born in</td><td><a href="https://basescan.org/tx/${esc(b.bornTx)}"><code>${esc(b.bornTx.slice(0, 10))}…</code></a></td></tr>
    </table>`;
}

function nodeRows(f) {
  return f.nodes.map((n) => `<div class="row"><span class="dot ${n.state === 'offline' || n.state === 'paused' ? 'off' : n.network}"></span><b>${NAME[n.network]}</b>
      <span class="muted">${n.state === 'alive' ? `alive · running ${since(n.since)}` : n.state === 'catching-up' ? `catching up · ${(b => b < 7200 ? `${Math.round(b / 60)} min` : `${Math.round(b / 3600)} h`)(Number(n.blocksBehind))} behind` : n.state === 'paused' ? `paused · ${esc(n.paused ?? '')}` : 'offline at the last check'} · ${esc(n.label)}</span></div>`).join('');
}
function owner(f) {
  const o = f.owner ?? {};
  return `<div class="row who">${o.pfp ? `<img src="${esc(o.pfp)}" alt="" referrerpolicy="no-referrer">` : ''}<span>@${esc(o.username)} · FID ${esc(o.fid)}</span></div>`;
}

function since(iso) {
  const ms = Date.now() - Date.parse(iso), h = Math.floor(ms / 3600e3);
  return h >= 24 ? `${Math.floor(h / 24)} d ${h % 24} h` : h >= 1 ? `${h} h` : `${Math.max(1, Math.round(ms / 60e3))} min`;
}

if (t && t[1].toUpperCase() === 'FATLINE') document.getElementById('nav-fatline').setAttribute('aria-current', 'page');
if (t) {
  fetch('/status.json', { cache: 'no-store' }).then((r) => r.ok ? r.json() : null).catch(() => null).then((s) => {
    const f = (s?.fatlines ?? []).find((x) => x.ticker.toLowerCase() === t[1].toLowerCase());
    if (!f) {
      document.title = 'Not found · Fatline';
      main.innerHTML = `<div><div class="kicker">Fatline</div><h1>No $${esc(t[1].toUpperCase())} here</h1>
        <p class="muted">${s ? 'No Fatline on this board has that name.' : 'The status of the board could not be loaded right now.'}</p><div class="links"><a class="btn primary" href="/explore.html">The board</a></div></div>`;
      return;
    }
    document.title = `$${f.ticker} · Fatline`;
    const coin = f.coin?.address
      ? `<p>Coin on Base: <a href="/base/${esc(f.coin.address)}"><code>${esc(f.coin.address)}</code></a></p>`
      : `<p class="muted">${esc(f.coin?.note ?? 'Coin not launched yet.')}</p>`;
    main.innerHTML = `<div><div class="kicker">Fatline</div><h1>$${esc(f.ticker)}</h1>${owner(f)}${coin}
      ${being(f)}<h2>Its nodes</h2>${nodeRows(f)}${body(f)}
      <div class="links"><a class="btn primary" href="/docs/">Run your own</a><a class="btn" href="/explore.html">The board</a></div></div>`;
  });
} else if (fidPath) {
  // Someone's Fatline. First their node: is it live, is it in sync, when was it last checked (the hatchery checks
  // it every hour). Then their egg or being, from the contract on Base. Then one line to run yours.
  const fid = Number(fidPath[1]);
  const RPC = 'https://mainnet.base.org';
  const HATCHERY = 'https://46-225-208-199.sslip.io';
  const rpc = (to, data) => fetch(RPC, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ jsonrpc: '2.0', id: 1, method: 'eth_call', params: [{ to, data }, 'latest'] }) }).then((r) => r.json()).then((j) => j.result).catch(() => null);
  const getJson = (url) => fetch(url, { cache: 'no-store' }).then((r) => (r.ok ? r.json() : null)).catch(() => null);
  const word = (n) => BigInt(n).toString(16).padStart(64, '0');
  const str = (hex) => { if (!hex || hex.length < 130) return ''; const b = hex.slice(2); const len = parseInt(b.slice(64, 128), 16); let o = ''; for (let i = 0; i < len; i++) o += String.fromCharCode(parseInt(b.slice(128 + i * 2, 130 + i * 2), 16)); return o; };
  const STONES = ['ivory', 'marble', 'sandstone', 'basalt', 'moss', 'gold', 'opal'];
  const PROMPT = 'Help me run a Fatline: https://fatline.ink/skill.md';
  const clock = (t) => new Date(t).toLocaleString([], { weekday: 'short', hour: '2-digit', minute: '2-digit' });
  document.title = `Fatline #${fid}`;
  main.innerHTML = `<div><div class="kicker">Fatline #${fid}</div><h1>Reading…</h1></div>`;
  const profile = fetch(`https://crackle.farcaster.xyz:3381/v1/userDataByFid?fid=${fid}`).then((r) => r.json()).catch(() => null);
  const ud = (t) => profile.then((j) => (j?.messages ?? []).find((m) => m.data?.userDataBody?.type === t)?.data.userDataBody.value ?? null);

  // Their node, from the hatchery's checks.
  function nodePanel(w) {
    const h = window.nodeHealth(w);
    if (!w) return `<h2>Their node</h2><p class="muted">${esc(h.detail)} ${'Once they lay an egg, the hatchery checks their node every hour and this page shows how it is doing.'}</p>`;
    const strip = (w.recent ?? []).map((c) => `<i class="${c.ok ? (c.syncing ? 'syncing' : 'ok') : 'bad'}" title="${esc(clock(c.at))}: ${c.ok ? (c.syncing ? `passed, catching up (${c.behind} blocks behind)` : 'passed') : esc(c.reason ?? 'failed')}"></i>`).join('');
    let host = '';
    try { host = new URL(w.node).host; } catch {}
    return `<h2>Their node</h2>
      <div class="state ${h.state}"><span class="dot"></span><div><b>${esc(h.title)}</b><p>${esc(h.detail)}</p></div></div>
      <table class="cost">
        <tr><td>Network</td><td>${esc(h.network)}</td></tr>
        ${host ? `<tr><td>Address</td><td><code>${esc(host)}</code></td></tr>` : ''}
        ${h.lastAt ? `<tr><td>Last check</td><td>${esc(window.nodeHealthAgo(Date.now() - h.lastAt))}</td></tr>` : ''}
        ${h.total ? `<tr><td>Recent checks passed</td><td>${h.passed} of ${h.total}</td></tr>` : ''}
      </table>
      ${strip ? `<div class="checks" aria-label="Recent checks, oldest first">${strip}</div><p class="note">Recent checks, oldest first (hover one for its time). Green passed, amber passed while catching up, red failed.</p>` : ''}
      <p class="note">Every hour the hatchery asks this node for its block heights and for two messages picked at random from its own copy of Farcaster. A check passes when the node answers, is in sync or catching up, returns those messages, and runs its own hatchery.</p>`;
  }

  // Their egg: three warm days hatch it. A day is 24 hours from the laying; it is warm at 18 passed checks.
  function warmPanel(w) {
    if (!w || w.hatched) return '';
    const days = [1, 2, 3].map((n) => {
      const d = w.days?.find((x) => x.day === n);
      const pct = d ? Math.min(100, Math.round(100 * d.passed / (d.need || 18))) : 0;
      const label = !d ? 'not started' : d.warm ? 'warm ✓' : d.done ? `cold (${d.passed} of ${d.need})` : `${d.passed} of ${d.need} so far`;
      return `<div class="meter"><div class="lbl"><span>Day ${n}</span><span>${label}</span></div><div class="bar"><i class="${d && d.done && !d.warm ? 'red' : ''}" style="width:${pct}%"></i></div></div>`;
    }).join('');
    const today = w.days?.at(-1);
    const next = today && w.layingAt ? Math.max(0, Math.ceil((w.layingAt + today.day * 86400000 - Date.now()) / 3600000)) : null;
    return `<p class="total"><b>${w.warmDays} of ${w.needed}</b> warm days${today && today.day < 3 && next !== null ? ` · day ${today.day + 1} starts in ${next} h` : ''}</p>${days}
      <p class="note">A day counts as warm at 18 passed checks out of about 24. A cold day doesn't reset the egg, it just doesn't count. If the node stops for good, the egg dies.</p>`;
  }

  Promise.all([
    getJson('https://raw.githubusercontent.com/jpfraneto/fatline/main/smart-contracts/deployments/base.json'),
    getJson('/fatliners-art.json').then((a) => a ?? {}), ud('USER_DATA_TYPE_USERNAME'), ud('USER_DATA_TYPE_PFP'),
    getJson(`${HATCHERY}/eggs/${fid}`), getJson('/status.json'),
  ]).then(async ([d, art, username, pfp, w, s]) => {
    const nft = d?.Fatliners?.address;
    const stage = nft ? Number(BigInt((await rpc(nft, '0xc7d25b15' + word(fid))) ?? '0x0')) : 0;
    const surname = stage && nft ? str(await rpc(nft, '0x8d967a78' + word(fid))) : '';
    const stone = stage && nft ? STONES[Number(BigInt((await rpc(nft, '0xeed0951e' + word(fid))) ?? '0x0'))] ?? 'ivory' : null;
    const genesis = Number(d?.Fatliners?.genesis?.fid) === fid;
    const name = genesis ? (d.Fatliners.genesis.name ?? 'Aster') : surname ? surname.charAt(0) + surname.slice(1).toLowerCase() : '';
    const img = stage === 2 ? (art.beings?.[fid]?.image ?? art.eggs?.[stone]?.image) : stage === 1 ? (art.eggs?.[stone]?.image ?? art.egg?.image) : null;
    const who = username ? `@${esc(username)}` : `FID ${fid}`;
    // A Fatline whose server we know (the master): its CPU, disks and what it costs.
    const f = (s?.fatlines ?? []).find((x) => Number(x.fatliner?.id) === fid);
    const being = stage
      ? `<h2>Their ${stage === 2 ? 'Fatliner' : 'egg'}</h2>
        <div style="display:grid;place-items:center;gap:10px;margin:18px 0 6px">
          <img src="${esc(img ?? '')}" alt="" style="width:min(260px,70vw);aspect-ratio:1;object-fit:cover;border-radius:50%;box-shadow:0 0 0 3px rgba(255,198,92,.35),0 0 60px 10px rgba(255,170,60,.25)">
          <div style="font:800 34px/1 Fraunces,Georgia,serif">${esc(name)}</div>
          <div class="muted" style="font:500 13px 'JetBrains Mono',monospace;letter-spacing:.2em">$${esc(surname)} · ${esc(stone.toUpperCase())} · ${stage === 2 ? 'HATCHED' : 'AN EGG, WARMING'}</div>
        </div>
        <p>${stage === 2 ? 'Their node stayed live for three days, and this egg hatched into a Fatliner.' : 'Their node keeps this egg warm. Three warm days and it hatches into a Fatliner.'}</p>
        ${warmPanel(w)}`
      : `<p class="muted">${who} has no egg yet.</p>`;
    main.innerHTML = `<div><div class="kicker">Fatline #${fid}</div>
      <h1 style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">${pfp ? `<img src="${esc(pfp)}" alt="" style="width:44px;height:44px;border-radius:50%">` : ''}${who}</h1>
      <p>${who} runs a Fatline: their own Farcaster node, and a client that reads only from it.</p>
      ${nodePanel(w)}
      ${being}
      ${f ? `<h2>Its server</h2>${nodeRows(f)}${body(f).replace('<h2>Its body</h2>', '')}` : ''}
      <div style="margin-top:40px;padding:18px;border:1px solid var(--line);border-radius:14px;background:rgba(0,0,0,.03)">
        <div class="kicker">Run yours</div>
        <p style="margin:6px 0 10px">Open your agent (Claude Code, Codex…) in a new folder and paste this one line. It sets up your own Farcaster node and your client, step by step, and asks before anything costs money (about 11 USDC a day, in your own wallet).</p>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><code id="prompt" style="padding:10px 12px;border-radius:10px;font-size:15px;flex:1;min-width:0;overflow-wrap:anywhere">${esc(PROMPT)}</code><button class="btn primary" id="copy" type="button">Copy</button></div>
        <p class="muted" style="margin:10px 0 0;font-size:14px">No agent? In a terminal: <code>curl -fsSL https://fatline.ink/install.sh | sh</code></p>
      </div>
      <div class="links"><a class="btn" href="/docs/">The docs</a><a class="btn" href="/about">All the nodes</a></div></div>`;
    document.getElementById('copy').onclick = async (e) => { try { await navigator.clipboard.writeText(PROMPT); e.target.textContent = 'Copied'; } catch { const r = document.createRange(); r.selectNode(document.getElementById('prompt')); getSelection().removeAllRanges(); getSelection().addRange(r); } };
  });
} else if (castPath) {
  // One cast, read by the genesis server from its own node (indexer/src/cast-page.mjs): no hosted API in between.
  const [, who, hash] = castPath;
  const net = new URLSearchParams(location.search).get('network') === 'hypersnap' ? 'hypersnap' : 'snapchain';
  const HATCHERY = 'https://46-225-208-199.sslip.io';
  const kicker = `<div class="kicker"><span class="dot ${net}"></span> A cast · read from Fatline's own ${NAME[net]} node</div>`;
  main.innerHTML = `<div>${kicker}<p class="muted">Reading…</p></div>`;
  const ago = (ms) => new Date(ms).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
  const linkify = (s) => esc(s).replace(/https?:\/\/[^\s<]+[^\s<.,;:!?)\]'"]/g, (u) => `<a href="${u}" rel="noopener">${u.replace(/^https?:\/\//, '')}</a>`).replace(/\n/g, '<br>');
  const isVideo = (u) => /\.(mp4|webm|mov|m3u8)(\?|#|$)/i.test(u);
  const isImage = (u) => /\.(png|jpe?g|gif|webp|avif)(\?|#|$)/i.test(u) || /^https:\/\/(imagedelivery\.net|i\.imgur\.com)\//.test(u);
  const embed = (u) => isVideo(u)
    ? `<video class="media" controls playsinline preload="metadata" src="${/\.m3u8/i.test(u) ? '' : esc(u) + (u.includes('#') ? '' : '#t=1')}" data-hls="${/\.m3u8/i.test(u) ? esc(u) : ''}"></video>`
    : isImage(u) ? `<a href="${esc(u)}" rel="noopener"><img class="media" src="${esc(u)}" alt="" loading="lazy" referrerpolicy="no-referrer"></a>`
    : `<a class="linkcard" href="${esc(u)}" rel="noopener">${esc(u.replace(/^https?:\/\//, ''))} ↗</a>`;
  const byline = (u, ts) => `<div class="row who">${u.pfp ? `<img src="${esc(u.pfp)}" alt="" referrerpolicy="no-referrer">` : ''}<span><b style="color:var(--ink)">${esc(u.displayName || u.username || `FID ${u.fid}`)}</b> · @${esc(u.username ?? `fid:${u.fid}`)} · ${esc(ago(ts))}</span></div>`;
  fetch(`${HATCHERY}/cast/${encodeURIComponent(who)}/${hash}${net === 'hypersnap' ? '?network=hypersnap' : ''}`, { cache: 'no-store' })
    .then(async (r) => ({ ok: r.ok, j: await r.json().catch(() => ({})) }))
    .then(({ ok, j }) => {
      if (!ok) throw new Error(j.error || 'The node did not answer.');
      const { cast: c, author: a, quotes, source: s } = j;
      document.title = `@${a.username ?? a.fid}: ${c.text.slice(0, 60)}${c.text.length > 60 ? '…' : ''} · Fatline`;
      const urls = c.embeds.filter((e) => typeof e === 'string');
      const short = c.id.slice(0, 10);
      main.innerHTML = `<article class="cast">${kicker}${byline(a, c.timestamp)}
        ${c.parent ? `<p class="note">A reply to <a href="/c/${c.parent.fid}/${esc(c.parent.hash)}${location.search}">a cast by FID ${c.parent.fid}</a></p>` : ''}
        <div class="text">${linkify(c.text)}</div>
        ${urls.map(embed).join('')}
        ${quotes.map((q) => `<a class="quote" href="/c/${q.fid}/${esc(q.id)}${location.search}">${byline(q.author, q.timestamp)}<div>${linkify(q.text)}</div></a>`).join('')}
        <p class="note">Read just now from ${esc(s.label)}${s.version ? ` (${NAME[s.network]} v${esc(s.version)}` : ''}${s.messages ? `, ${Number(s.messages).toLocaleString('en-US')} messages)` : s.version ? ')' : ''}, not from a hosted API.
          Hash <code>${esc(c.id)}</code>, FID ${c.fid}.</p>
        <div class="links"><a class="btn" href="https://farcaster.xyz/${esc(a.username ?? '')}/${short}">On farcaster.xyz ↗</a><a class="btn primary" href="/docs/">Run your own node</a></div></article>`;
      const v = main.querySelector('video[data-hls]:not([data-hls=""])');
      if (v && !v.canPlayType('application/vnd.apple.mpegurl')) {
        const sc = document.createElement('script');
        sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js';
        sc.onload = () => { const h = new window.Hls(); h.loadSource(v.dataset.hls); h.attachMedia(v); };
        document.head.appendChild(sc);
      } else if (v) v.src = v.dataset.hls;
    })
    .catch((e) => {
      document.title = 'Cast not found · Fatline';
      main.innerHTML = `<div>${kicker}<h1>No cast here</h1><p class="muted">${esc(e.message)}</p>
        <p class="muted">A cast's page is <code>/c/&lt;username or FID&gt;/&lt;hash&gt;</code>. The hash can be the short one from a farcaster.xyz link.</p>
        <div class="links"><a class="btn primary" href="/docs/">Run your own node</a></div></div>`;
    });
} else if (appPath) {
  // One node, one client, one contract: which Fatline runs on this contract (Fatliners.appOf, its AppSet events).
  const app = appPath[1].toLowerCase();
  const RPC = 'https://mainnet.base.org';
  const rpc = (method, params) => fetch(RPC, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ jsonrpc: '2.0', id: 1, method, params }) }).then((r) => r.json()).then((j) => j.result);
  const word = (n) => BigInt(n).toString(16).padStart(64, '0');
  const str = (hex) => { const b = hex.slice(2); const len = parseInt(b.slice(64, 128), 16); let o = ''; for (let i = 0; i < len; i++) o += String.fromCharCode(parseInt(b.slice(128 + i * 2, 130 + i * 2), 16)); return o; };
  const scan = `https://basescan.org/address/${app}`;
  main.innerHTML = `<div><div class="kicker">Base · app contract</div><h1>Reading…</h1><p><code>${esc(app)}</code></p></div>`;
  fetch('https://raw.githubusercontent.com/jpfraneto/fatline/main/smart-contracts/deployments/base.json', { cache: 'no-store' }).then((r) => r.json()).then(async (d) => {
    const nft = d.Fatliners.address;
    const logs = await rpc('eth_getLogs', [{ address: nft, fromBlock: '0x' + Number(d.fromBlock).toString(16), toBlock: 'latest',
      topics: ['0xbb87f81106f8d961218386a4db09914d0ee98730973a7e85b726b37a340045d4', null, '0x' + word(app)] }]) ?? [];
    const fids = [...new Set(logs.map((l) => Number(BigInt(l.topics[1]))))];
    const live = [];
    for (const fid of fids) { // still tied now? (a holder can replace it)
      const now = await rpc('eth_call', [{ to: nft, data: '0xd47eae63' + word(fid) }, 'latest']);
      if (now && now.slice(-40).toLowerCase() === app.slice(2)) live.push({ fid, surname: str(await rpc('eth_call', [{ to: nft, data: '0x8d967a78' + word(fid) }, 'latest'])) });
    }
    if (!live.length) {
      document.title = `${app.slice(0, 10)}… · Fatline`;
      main.innerHTML = `<div><div class="kicker">Base · app contract</div><h1>No Fatline runs on this yet</h1><p><code>${esc(app)}</code></p>
        <p class="muted">A Fatline's holder ties one smart contract to it (<code>setApp</code>): the one its client runs on. None is tied to this address right now.</p>
        <div class="links"><a class="btn" href="${scan}">Basescan ↗</a><a class="btn primary" href="/docs/">Run your own</a></div></div>`;
      return;
    }
    const f = live[0];
    document.title = `$${f.surname} · app · Fatline`;
    main.innerHTML = `<div><div class="kicker">Base · the app of Fatline #${f.fid}</div><h1>$${esc(f.surname)}</h1><p><code>${esc(app)}</code></p>
      <p>This is the smart contract Fatline #${f.fid}'s client runs on. One node, one client, one contract: the coin points here, and so does its client.</p>
      <div class="links"><a class="btn" href="${scan}">Basescan ↗</a><a class="btn" href="/fatliners/${f.fid}">The being</a><a class="btn primary" href="/docs/">Run your own</a></div></div>`;
  }).catch(() => { main.innerHTML = `<div><div class="kicker">Base · app contract</div><h1>Could not read Base right now</h1><p><code>${esc(app)}</code></p><div class="links"><a class="btn" href="${scan}">Basescan ↗</a></div></div>`; });
} else if (!m) {
  document.title = 'Not found · Fatline';
  main.innerHTML = `<div><div class="kicker">404</div><h1>Nothing here</h1>
    <p class="muted">No page at <code>${esc(location.pathname)}</code>. A coin's page is <code>/base/0x…</code>, its contract address on Base. A cast's page is <code>/c/&lt;username&gt;/&lt;hash&gt;</code>.</p>
    <div class="links"><a class="btn primary" href="/explore.html">The board</a></div></div>`;
} else {
  const address = m[1];
  fetch('/status.json', { cache: 'no-store' }).then((r) => r.ok ? r.json() : null).catch(() => null).then((s) => {
    const f = (s?.fatlines ?? []).find((x) => x.coin?.address?.toLowerCase() === address.toLowerCase());
    const scan = `https://basescan.org/token/${address}`;
    if (!f) {
      document.title = `${address.slice(0, 10)}… · Fatline`;
      main.innerHTML = `<div><div class="kicker">Base · coin</div><h1>Not a known Fatline</h1>
        <p><code>${esc(address)}</code></p>
        <p class="muted">No Fatline on this board has this address. It may be any other token on Base, or a Fatline that isn't listed yet.</p>
        <div class="links"><a class="btn" href="${scan}">Basescan ↗</a><a class="btn primary" href="/explore.html">The board</a></div></div>`;
      return;
    }
    document.title = `$${f.ticker} · Fatline`;
    main.innerHTML = `<div><div class="kicker">Base · Fatline coin</div><h1>$${esc(f.ticker)}</h1>
      <p><code>${esc(address)}</code></p>${owner(f)}
      <h2>Nodes it keeps alive</h2>${nodeRows(f)}${body(f)}
      <div class="links"><a class="btn" href="${scan}">Basescan ↗</a><a class="btn primary" href="/explore.html">The board</a></div></div>`;
  });
}
</script>
<script src="/nav.js"></script>
</body>
</html>
