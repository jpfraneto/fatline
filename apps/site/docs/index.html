<style>
  :root { --paper: #efe2c6; --paper2: #f6ecd7; --ink: #3a2a1b; --muted: #806a4b; --line: rgba(90, 66, 40, .24); --code: #2b1f14; --codeink: #f6ecd7; --blue: #3d8bff; --pink: #ff5fa8; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --paper: #17120d; --paper2: #221a12; --ink: #f1e4c8; --muted: #a8916c; --line: rgba(241, 228, 200, .16); --code: #0f0b08; }
  }
  :root[data-theme="dark"] { --paper: #17120d; --paper2: #221a12; --ink: #f1e4c8; --muted: #a8916c; --line: rgba(241, 228, 200, .16); --code: #0f0b08; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 18.5px/1.7 Fraunces, Georgia, serif; font-variation-settings: 'opsz' 18, 'SOFT' 100; }
  nav { display: flex; justify-content: center; gap: clamp(20px, 6vw, 56px); padding: 28px 16px 0; }
  nav a { color: var(--ink); text-decoration: none; font: 500 13px/1 'JetBrains Mono', ui-monospace, monospace; letter-spacing: .18em; opacity: .75; }
  nav a[aria-current] { opacity: 1; text-decoration: underline; text-underline-offset: 6px; }

  article { max-width: 680px; margin: 0 auto; padding: 48px 16px 80px; }
  article h1 { margin: 0 0 28px; font-weight: 800; font-size: clamp(52px, 11vw, 96px); line-height: .95; letter-spacing: -.02em; font-variation-settings: 'opsz' 144, 'SOFT' 100, 'WONK' 1; }
  article h2 { position: relative; margin: 64px 0 14px; font-weight: 700; font-size: 30px; line-height: 1.15; font-variation-settings: 'opsz' 96, 'SOFT' 100, 'WONK' 1; }
  /* every section opens with the line of light */
  article h2::before { content: ""; display: block; width: 56px; height: 2px; margin-bottom: 18px; border-radius: 2px; background: linear-gradient(90deg, var(--blue), var(--pink)); }
  article p, article ol, article ul { margin: 0 0 16px; }
  article li { margin: 0 0 6px; }
  article a { color: inherit; text-decoration-color: color-mix(in srgb, var(--pink) 70%, transparent); text-underline-offset: 3px; }
  article em { font-style: italic; }
  article strong { font-weight: 650; }
  article :not(pre) > code { font: .84em 'JetBrains Mono', ui-monospace, monospace; padding: .1em .35em; border-radius: 5px; background: color-mix(in srgb, var(--ink) 9%, transparent); }

  .demo { display: block; width: 100%; aspect-ratio: 16 / 9; border-radius: 16px; background: #1a130d; object-fit: cover; box-shadow: 0 18px 50px rgba(50, 30, 10, .25); }
  .demo-missing { display: grid; place-items: center; width: 100%; aspect-ratio: 16 / 9; border-radius: 16px; color: #f6ecd7; text-align: center; padding: 16px;
    background: linear-gradient(rgba(20, 14, 8, .55), rgba(20, 14, 8, .55)), url(../img/world/the-weaving.jpg) center / cover; font: 500 14px/1.5 'JetBrains Mono', monospace; letter-spacing: .06em; }
  .demo + p, .demo-missing + p { margin-top: 10px; color: var(--muted); font-size: 15px; text-align: center; }

  .code { position: relative; margin: 0 0 12px; }
  .code pre { margin: 0; padding: 14px 76px 14px 18px; border-radius: 14px; background: var(--code); color: var(--codeink); overflow-x: auto; border: 1px solid rgba(246, 236, 215, .1); }
  .code pre code { font: 14px/1.55 'JetBrains Mono', ui-monospace, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
  .code button { position: absolute; top: 9px; right: 9px; font: 600 12.5px Inter, sans-serif; color: var(--code); background: var(--codeink); border: 0; border-radius: 8px; padding: 6px 11px; cursor: pointer; }
  /* the four by-hand commands are numbered */
  .steps { counter-reset: step; }
  .steps .code { counter-increment: step; padding-left: 34px; }
  .steps .code::before { content: counter(step); position: absolute; left: 0; top: 12px; width: 24px; height: 24px; display: grid; place-items: center; border-radius: 50%; background: var(--ink); color: var(--paper); font: 700 12px Inter, sans-serif; }

  table { width: 100%; border-collapse: collapse; margin: 6px 0 16px; font: 15px/1.5 Inter, system-ui, sans-serif; }
  thead { display: none; }
  td { padding: 10px 0; border-top: 1px solid var(--line); vertical-align: top; }
  td:first-child { width: 34%; padding-right: 14px; }
  footer { padding: 0 16px 32px; text-align: center; font: 12.5px Inter, sans-serif; color: var(--muted); }
  footer a { color: inherit; }

<article id="doc"><p>Loading… <a href="index.md">Read the Markdown</a>.</p></article>

<footer>This page is <a href="index.md">one Markdown file</a> · <a href="https://github.com/jpfraneto/fatline/edit/main/apps/site/docs/index.md">edit it on GitHub</a> · open source, MIT</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
(async () => {
  const doc = document.getElementById('doc');
  try {
    const md = await (await fetch('index.md', { cache: 'no-cache' })).text();
    doc.innerHTML = marked.parse(md);
  } catch {
    doc.innerHTML = '<p>Could not load this page. <a href="index.md">Read the Markdown</a> or <a href="tutorial.html">the tutorial</a>.</p>';
    return;
  }
  // Until the demo is recorded, its frame says so instead of showing a broken player.
  const v = doc.querySelector('video.demo');
  if (v) {
    const missing = () => { const d = document.createElement('div'); d.className = 'demo-missing'; d.textContent = 'THE FIRST DEMO · COMING SOON'; v.replaceWith(d); };
    v.addEventListener('error', missing, true);
    fetch(v.getAttribute('src'), { method: 'HEAD' }).then((r) => { if (!r.ok) missing(); }).catch(missing);
  }
  // Every code block gets a Copy button; consecutive shell blocks become numbered steps.
  doc.querySelectorAll('pre').forEach((pre) => {
    const wrap = document.createElement('div'); wrap.className = 'code';
    pre.replaceWith(wrap); wrap.append(pre);
    const b = document.createElement('button'); b.type = 'button'; b.textContent = 'Copy';
    b.onclick = async () => { try { await navigator.clipboard.writeText(pre.innerText.trim()); b.textContent = 'Copied'; } catch { b.textContent = 'Select it'; } setTimeout(() => (b.textContent = 'Copy'), 1600); };
    wrap.append(b);
  });
  const blocks = [...doc.querySelectorAll('.code')];
  for (let i = 0; i < blocks.length; i++) {
    let run = [blocks[i]];
    while (blocks[i + run.length] && blocks[i + run.length - 1].nextElementSibling === blocks[i + run.length]) run.push(blocks[i + run.length]);
    if (run.length > 1) { const g = document.createElement('div'); g.className = 'steps'; run[0].before(g); g.append(...run); i += run.length - 1; }
  }
  if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
})();
</script>
</body>
