# Publishes apps/site to GitHub Pages at https://fatline.ink: the home page (the Fatline board) and the
# tutorial at /docs. Every 15 minutes it also checks the real Fatlines' nodes into status.json, because the
# page is https and the nodes speak plain http. And it writes each Fatliner's and each egg's token metadata from
# the contract's events (apps/site/fatliners.mjs).
name: site
on:
  push:
    branches: [main]
    paths: ['apps/site/**', '.github/workflows/site.yml']
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the nodes
        run: node apps/site/status.mjs apps/site/status.json
      - name: Token metadata (tokenURI = fatline.ink/fatliners/<fid>)
        continue-on-error: true # if Base can't be read, the committed files stay
        run: node apps/site/fatliners.mjs apps/site/fatliners
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/site
      - id: deployment
        uses: actions/deploy-pages@v4
