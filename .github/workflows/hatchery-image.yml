# Builds the hatchery container (infra/hatchery.Dockerfile) for amd64 and arm64 and publishes it to
# ghcr.io/jpfraneto/fatline-hatchery, tagged with the commit it was built from (and "latest" on main).
# GitHub signs a provenance attestation for every image: anyone can check that an image was built here,
# from this repository, by this workflow, before running it:
#   gh attestation verify oci://ghcr.io/jpfraneto/fatline-hatchery:<commit> --owner jpfraneto
# Every action is pinned to a commit.
name: hatchery-image
on:
  push:
    branches: [main]
    paths: ['indexer/**', 'fatliners/src/**', 'fatliners/calibration/**', 'smart-contracts/deployments/base.json',
            'infra/hatchery.Dockerfile', 'infra/hatchery-entry.mjs', '.dockerignore', '.github/workflows/hatchery-image.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
concurrency:
  group: hatchery-image
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tests first
        run: cd indexer && npm ci --ignore-scripts --no-audit --no-fund && npm test
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/hatchery.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: FATLINE_COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/fatline-hatchery:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/fatline-hatchery:latest
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/fatline-hatchery
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
